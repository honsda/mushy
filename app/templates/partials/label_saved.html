<div class="label-modal" role="dialog" aria-modal="true" aria-labelledby="label-saved-title">
  <div class="label-modal-card">
    <h2 id="label-saved-title" class="font-semibold text-slate-900">Observation saved</h2>
    <p class="mt-1 text-sm text-slate-600">
      <span class="italic">{{ species }}</span> recorded as
      {% if observed %}<span class="font-medium text-emerald-700">present</span>{% else %}<span class="font-medium text-slate-700">absent</span>{% endif %}
      (label #{{ label_id }}).
    </p>
    <p class="mt-2 text-xs text-slate-500">
      It will be included the next time the model is retrained.
    </p>
    <button type="button"
            class="mt-4 rounded bg-slate-700 px-3 py-1 text-sm font-medium text-white hover:bg-slate-800"
            hx-get="{{ url_for('label_modal_close') }}"
            hx-target="#label-modal"
            hx-swap="innerHTML">
      Close
    </button>
  </div>
</div>
