<div class="rounded-2xl shadow-sm bg-white p-4 h-full"
     hx-get="{{ url_for('partial_heatmap') }}?layer={{ active_layer }}"
     hx-trigger="every 30s"
     hx-swap="outerHTML">
  <div class="flex flex-wrap items-start justify-between gap-2">
    <div>
      <h2 class="font-semibold">{{ layer.heading }}</h2>
      <p class="text-xs text-slate-500">
        Interpolated field &middot; {{ cfg.spatial.method|upper }} &middot;
        {{ cfg.spatial.x_max }}&times;{{ cfg.spatial.y_max }} m &middot;
        sites labelled with FGPI + predicted species
      </p>
    </div>
    <div class="flex items-center gap-2">
      <label class="sr-only" for="map-layer">Map layer</label>
      <select id="map-layer"
              name="layer"
              class="rounded-lg border border-slate-300 bg-white py-1 pl-2 pr-7 text-xs shadow-sm focus:border-emerald-500 focus:outline-none"
              hx-get="{{ url_for('partial_heatmap') }}"
              hx-trigger="change"
              hx-target="closest div.rounded-2xl"
              hx-swap="outerHTML"
              hx-include="this">
        {% for option in layers %}
        <option value="{{ option.key }}"{% if option.key == active_layer %} selected{% endif %}>{{ option.label }}</option>
        {% endfor %}
      </select>
      <span class="rounded-full bg-slate-100 px-2 py-1 text-xs text-slate-600">30 s</span>
    </div>
  </div>

  <img
    src="{{ url_for('map_png', layer=active_layer) }}?t={{ heatmap_token }}"
    alt="Map of {{ layer.label|lower }} over the monitored area, with sensor sites labelled by FGPI and predicted species. Model output, not detection."
    class="mt-3 w-full rounded-2xl border border-slate-100"
    width="640" height="455" loading="lazy" decoding="async">

  <div class="mt-2 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-500">
    <p>{{ layer.note }}</p>
    <a class="font-medium text-emerald-700 hover:underline"
       href="{{ url_for('map_png', layer=active_layer) }}?t={{ heatmap_token }}"
       target="_blank" rel="noopener">open full size</a>
  </div>
</div>
