<div class="rounded-2xl shadow-sm bg-white p-4 h-full">
  <div class="flex flex-wrap items-center justify-between gap-2">
    <div>
      <h2 class="font-semibold">FGPI map</h2>
      <p class="text-xs text-slate-500">Spatial interpolation &middot; {{ cfg.spatial.method|upper }} &middot; {{ cfg.spatial.x_max }}&times;{{ cfg.spatial.y_max }} m</p>
    </div>
    <span class="rounded-full bg-slate-100 px-2 py-1 text-xs text-slate-600">refreshes 30 s</span>
  </div>
  <img
    src="{{ url_for('heatmap_png') }}?t={{ heatmap_token }}"
    alt="Heatmap of predicted fungal growth potential over the monitored area. Green is low, red is critical."
    class="mt-3 w-full rounded-2xl border border-slate-100"
    width="640" height="480" loading="lazy" decoding="async">
  <p class="mt-2 text-xs text-slate-500">Green = low &middot; amber = moderate/high &middot; red = critical. Model output, not detection.</p>
</div>
